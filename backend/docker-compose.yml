# Local development database only. Production Postgres runs on the Oracle Cloud
# instance directly (see docs/DEPLOY.md) — not in Docker.
services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports:
      - '5432:5432'
    volumes:
      - aegis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aegis -d aegis']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aegis-pgdata:
